  - name: Santiago Benoit
    photo: /wp-content/uploads/2020/12/017-1-scaled.jpg
    linkedin: https://www.linkedin.com/in/santiago-benoit
    bio: <p>Santiago Benoit is an MS student in LTI who previously majored in Artificial Intelligence at Carnegie Mellon University. He is currently working on generative modeling of multimodal speech from text, encoderless stochastic variational inference, and temporal sequence modeling, especially applied to music generation. His research interests are in both theoretical and applied artificial intelligence. Some of his favorite subfields in AI include multimodal machine learning, generative modeling, and reinforcement learning.</p>
