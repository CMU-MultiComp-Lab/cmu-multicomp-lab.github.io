    bio: <p>Bhaavanaa Thumu is a MS student pursuing a Master’s in Electrical and Computer Engineering. Her research interests include multimodal machine learning, video understanding, and multi-agent multimodal AI systems. </p>
  - name: Nihal Jain
    photo: /wp-content/uploads/2022/01/Nihal_Jain_384x384.png
    website: http://nihaljain.xyz/
    bio: <p>Nihal Jain is a Master’s in Machine Learning student at CMU. His research focuses on developing interpretability tools for analysis of multimodal machine learning models. He has previously worked on applications of deep learning in information retrieval when he was interning at Adobe Research. Before joining CMU, he obtained a B.E. in Computer Science at the Birla Institute of Technology &amp; Science (BITS), Pilani, India.</p>
