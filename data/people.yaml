- id: d_students
  title: Ph.D Students
  members:
  - name: Gaoussou Youssouf Kebe
    photo: /wp-content/uploads/2023/04/me_cropped2-scaled.jpg
    website: https://gkebe.github.io
    scholar: https://scholar.google.com/citations?hl=en&user=jTHl7eMAAAAJ
    bio: <p>Youssouf Kebe is a PhD student at the Language Technologies Institute of the School of Computer Science at Carnegie Mellon University. His research focuses on modeling social interactions and exploring the influence of individual differences such as personality traits on social communication and behavior across various modalities such as visual, verbal, and vocal. Youssouf aims to build interactive agents that can interpret social cues in real-time and respond appropriately in personalized ways, with potential applications in mental health, education, and human-robot interaction. He obtained his M.S in Computer Science from the University of Maryland, Baltimore County, where he worked on mitigating bias in language grounding models under the guidance of Cynthia Matuszek, and completed his B.S in Computer Engineering at Bursa Technical University in Turkey.</p>
  - name: Leena Mathur
    photo: /wp-content/uploads/2022/12/Mathur_Leena-e1670100023486.jpg
    website: https://l-mathur.github.io
    scholar: https://scholar.google.com/citations?user=loh93ZkAAAAJ&hl=en
    bio: <p>Leena Mathur is a PhD student at CMU’s School of Computer Science in the Language Technologies Institute. Her work is supported by the National Science Foundation Graduate Research Fellowship. Her long-term research goal is to advance virtual and embodied AI systems that can perceive, understand, and respond to multimodal human communication during social interactions. Her research focuses on foundations of multimodal learning and artificial social intelligence, as well as real-world applications of multimodal AI to enhance human health and well-being. Leena completed her B.S. in Computer Science with engineering honors distinction in research, B.A. in Linguistics, and B.A. in Cognitive Science at the University of Southern California as a Goldwater Scholar, Astronaut Scholar, and CRA Outstanding Undergraduate Researcher Awardee. As an undergraduate, she worked with Maja Matarić and Khalil Iskarous at USC, Ralph Adolphs at Caltech, Michael Shindler at UC Irvine, and Rémi Lebret at the Ecole Polytechnique Fédérale de Lausanne. </p>
  - name: Alex Wilf
    photo: /wp-content/uploads/2021/09/awilf_rescaled-2.jpg
    website: https://abwilf.github.io/
    scholar: https://scholar.google.com/citations?user=r1Zw-VEAAAAJ&hl=en
    bio: <p>Alex Wilf is a doctoral student in the Language Technologies Institute in the School of Computer Science.  He is interested in multimodal representation learning, specifically for tasks involving how people express themselves – both when they are alone and in groups, and across both modalities and languages. He is currently interested in the promise of self-supervised learning and graph neural network architectures for use in designing novel multimodal networks. He completed his B.S. in Computer Science at the University of Michigan, where he worked with Emily Mower Provost on building robust and generalizable models for speech emotion recognition.</p>
  - name: Martin Q. Ma
    photo: /wp-content/uploads/2020/12/martin_ma-1.jpeg
    website: http://www.cs.cmu.edu/~qianlim/
    scholar: https://scholar.google.com/citations?user=TFCtuaQAAAAJ&hl=en
    linkedin: https://www.linkedin.com/in/martinmamql/
    bio: <p>Martin Q. Ma is a Ph.D. student in the School of Computer Science at Carnegie Mellon University, advised by Louis-Philippe Morency. He also collaborates with Ruslan Salakhutdinov, Kun Zhang, and Yao-Hung Hubert Tsai. He graduated with a degree in mathematics and computer science from Brandeis University. His research focuses on developing new self-supervised learning methods based on neuroscience insights, understanding self-supervised learning with theoretical frameworks, and designing self-supervised algorithms for multimodal tasks. His works have been published in NeurIPS, CVPR, ICLR, EMNLP, and were acknowledged by a highlight in CVPR and an oral in NeurIPS Science meets Engineering of Deep Learning workshop.</p>
  - name: Paul Pu Liang
    photo: /wp-content/uploads/2018/11/photo2023_small.jpeg
    website: http://www.cs.cmu.edu/~pliang/
    scholar: https://scholar.google.com/citations?hl=en&user=pKf5LtQAAAAJ
    bio: '<p><span style="font-weight: 400;">Paul is Ph.D. student in the Machine Learning Department at CMU, advised by Louis-Philippe Morency and Ruslan Salakhutdinov. His long-term research goal is to build socially intelligent embodied agents with the ability to perceive and engage in multimodal human communication. As steps towards this goal, his research focuses on 1) the fundamentals of multimodal learning, specifically the representation, translation, fusion, and alignment of heterogeneous data sources, 2) human-centered language, vision, speech, robotics, and healthcare applications, as well as 3) the real-world deployment of socially intelligent agents by improving fairness, robustness, and interpretability in real-world applications. Previously, he received an M.S. in Machine Learning and a B.S. with University Honors in Computer Science from CMU</span></p>'
  - name: Victoria Lin
    photo: /wp-content/uploads/2018/07/VictoriaLin-1-1.jpg
    scholar: https://scholar.google.com/citations?user=_rHMG-0AAAAJ&hl=en
    linkedin: https://www.linkedin.com/in/victoria-lin-976549a9/
    bio: <p>Victoria is a Ph.D. student in the Department of Statistics at Carnegie Mellon University. Her research interests include multimodal behavior analysis, uncertainty quantification, causal inference for high-dimensional and complex longitudinal data, and applications in mental health and medical diagnostics. Prior to joining CMU, Victoria was a researcher with Miguel Hernán in the Program for Causal Inference at the Harvard School of Public Health. She received her M.S. in data science from CMU and her joint A.B. in statistics and in molecular and cellular biology from Harvard University.</p>
  - name: Torsten Wörtwein
    photo: /wp-content/uploads/2017/09/Torsten_Wortwein.jpg
    website: https://twoertwein.github.io/
    scholar: https://scholar.google.com/citations?user=SuTJ0iMAAAAJ
    linkedin: https://www.linkedin.com/in/torstenwoertwein/
    bio: <p>Torsten Wörtwein is a Ph.D. student in the Language Technologies Institute. His research interests include affective computing, integrating statistical methods in deep learning, multimodal behavior analysis, and healthcare analytics with a focus on symptoms of depression and psychotic disorders. He is currently focusing on emotion recognition and its technical challenges including uncertainty estimation and personalization. Previously, he worked on public speaking anxiety and public speaking performance assessment as well as on several computer vision projects. He received his B.Sc. and M.Sc. in Informatics from the Karlsruhe Institute of Technology in Germany and a M.Sc. in Language Technologies from Carnegie Mellon University.</p>
  - name: Alexandria Vail
    photo: /wp-content/uploads/2017/06/dsc_1956_35106438426_o.jpg
    website: http://alexandriakvail.com
    bio: '<p><span style="font-weight: 400;">Alexandria K. Vail is a Ph.D. student in Human-Computer Interaction. Her research interests include user modeling, affective computing, and multimodal behavior analysis, particularly within the context of healthcare and clinical decision support technologies. Her work recently received the Best Paper Award at the International Conference on User Modelling, Adaptation, and Personalization; this work has also been recognized with distinction at the International Conference on Intelligent Tutoring Systems and the International Conference on Educational Data Mining. Before joining CMU, she received the B.S. degree in Computer Science and the B.S. degree in Mathematics from North Carolina State University, with minor concentrations in Cognitive Science and Physics.</span></p>'
  style: figure
