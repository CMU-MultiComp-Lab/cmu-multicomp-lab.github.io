- id: f_undergraduate
  title: Former Undergraduate Research Assistants
  members:
  - name: Aneesha Sampath
    photo: /wp-content/uploads/2022/01/AneeshaSampath.jpg
    empty_link_box: true
    bio: <p>Aneesha is an undergraduate student at Carnegie Mellon University majoring in Artificial Intelligence and minoring in Language Technologies. Her research interests lie in Natural Language Processing and Multimodal Deep Learning. Her current project involves uncertainty quantification.</p>
  - name: Shuyu Zhang
    photo: /wp-content/uploads/2022/01/ShuyuZhang.jpg
    empty_link_box: true
    bio: <p>Shuyu Zhang is an undergraduate in the BXA program studying computer science and art. She is currently working on the CMU-MOSEAS project by organizing data, processing datasets, and teaching others to do the same. Her research interests include multimodal machine learning, multimodal language models, and ethics of machine learning.</p>
  - name: Edward Garemo
    photo: /wp-content/uploads/2022/01/EdwardGaremo.jpeg
    empty_link_box: true
    bio: <p>Edward Garemo is an undergraduate student in SCS studying computer science. He is interested in understanding and developing the theoretical foundations and practical implementations of automated generalizable learning models.</p>
  - name: Evan Zhang
    photo: /wp-content/uploads/2022/01/EvanZhang_cropped.png
    empty_link_box: true
    bio: <p>Hi, I’m Evan! I’m currently a freshman in SCS and plan on concentrating in machine learning. I became very interested in both software engineering and data science after completing various projects in both fields. In my free time, I like to play sports (ping pong, frisbee, basketball), listen to music (pop for sure), and hang out with friends.</p>
  - name: Niki Murikinati
    photo: /wp-content/uploads/2021/03/niki.jpg
    empty_link_box: true
    bio: <p>Niki is a junior studying Computer Science and minoring in Machine Learning at Carnegie Mellon. Her interests lie in Multimodal Machine Learning and Natural Language Processing. She is currently working on a project involving generating speech with prosodic features from visual gesture data and text transcripts.</p>
  - name: Arvin Wu
    photo: /wp-content/uploads/2021/03/arvin.jpg
    empty_link_box: true
    bio: <p>Arvin is an undergraduate computer science student at CMU. He is interested in Multi-Modal Machine Learning, Computer Vision, and Natural Language Processing. He is currently working on a data mining project for gesture generation research.</p>
  - name: Shreya Bali
    photo: /wp-content/uploads/2020/09/ShreyaBali.jpg
    scholar: https://scholar.google.com/citations?user=MkIlWQsAAAAJ&hl=en
    researchgate: https://www.linkedin.com/in/shreya-bali-089478107/
    researchgate_style: li
    bio: <p>Shreya is a senior in the Carnegie Mellon School of Computer Science, minoring in Machine Learning. She is currently working on audio source separation and is broadly interested in audio/speech-related tasks, and reinforcement learning. Previously, she has worked on using machine learning to identify related ideas in scientific text and patents.</p>
  - name: Gayatri Shandar
    photo: /wp-content/uploads/2018/11/Gayatri.png
    empty_link_box: true
    bio: <p>Gayatri Shandar is an undergraduate in the School of Computer Science at Carnegie Mellon University. She works with Dr. Girard where her current research interests include developing machine learning models to further facial computing and the understanding of human emotion and its influences on facial behavior.</p>
  - name: Holmes Wu
    photo: /wp-content/uploads/2018/11/f237d9_d4e0db6fe7d24f7d92855da05d6fdcb9mv2.jpg
    empty_link_box: true
    bio: <p>Holmes Wu is an undergraduate student in Carnegie Mellon University. His current research project involves convolutional neural networks in 3D. His hope to gain in-depth understanding of the underlying principles of machine learning, especially deep learning.</p>
  - name: Alexander Schneidman
    photo: /wp-content/uploads/2018/11/f237d9_e7ddd04e92d2465a828257fc15f09984mv2.jpg
    empty_link_box: true
    bio: <p>Alex Schneidman is an undergraduate student in Computer Science at Carnegie Mellon University. His research involves designing tools that collect and organize datasets to train machine learning models in social interactions. He hopes to continue studying machine learning to explore its applications in Artificial Intelligence and Computational Finance.</p>
  - name: Michael Chan
    photo: /wp-content/uploads/2018/11/f237d9_ef571b2b6a2f40beafa0e3197ee97fd0mv2.jpg
    empty_link_box: true
    bio: <p>Michael Chan is an undergraduate student at Carnegie Mellon University. His current work concerns using artifical intelligence to identify qualities of human social interaction through body language and speech from video clips. Michael hopes to learn more about machine learning overall and intends to use his knowledge to challenge the artistic and creative capabilities of machine learning models.</p>
  - name: Katrina Jiao
    photo: /wp-content/uploads/2020/09/Katrina-Jiao.jpg
    website: https://www.linkedin.com/in/jie-jiao-683335118/
    bio: <p>Katrina is an undergraduate student in Computer Science. Her research interests lie in representation learning for Reinforcement Learning tasks and multimodal machine learning techniques. Her current work concerns improving the language grounding process in text-assisted RL in order to facilitate the transfer between similar video game environments.</p>
  - name: Azaan Rehman
    photo: /wp-content/uploads/2020/09/arehman-Azaan.jpg
    empty_link_box: true
    bio: <p>Azaan is in his senior year as a Computer Science Undergraduate. His research interests lie in Multi-modal Machine Learning and Natural Language Processing, and his current goal is to produce a system that’s able to communicate, interact and adapt with humans in everyday life.</p>
  - name: Jonathan VanBriesen
    photo: /wp-content/uploads/2017/09/jon.png
    empty_link_box: true
    bio: <p>Jonathan VanBriesen was an undergraduate pursuing a major in Computer Science at Carnegie Mellon University. He was doing research under Amir Zadeh focused on multimodal sentiment analysis.</p>
  - name: Edmund Tong
    photo: /wp-content/uploads/2017/09/edmund.png
    empty_link_box: true
    bio: <p>Edmund Tong was an undergraduate who is pursuing a Computer Science major and Language Technologies minor at Carnegie Mellon University. He has been an undergraduate researcher with the Multimodal Communication and Machine Learning Lab since October 2015. Notably, the work that Edmund has done with Amir Zadeh and Prof. Louis-Philippe Morency on applying deep multimodal networks to combat human trafficking is published at ACL 2017. Edmund’s research interests include multimodal representations and theoretical bases for deep learning, and he can be contacted at edtong AT cmu DOT edu.</p>
