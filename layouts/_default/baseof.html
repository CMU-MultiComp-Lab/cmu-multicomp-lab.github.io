<!doctype html>
<html>
<head>
    <!-- BEGIN META INFORMATION-->
    <meta charset="utf-8">
    <title>{{ if .IsHome }}Multicomp Lab{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1, maximum-scale=1"/>
    <!-- START STYLESEETS -->
    <link rel="stylesheet" href="/wp-content/themes/multicomp/style.css" type="text/css"/>
    <link rel="shortcut icon" href="/wp-content/themes/multicomp/images/favicon.ico"/>
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}"/>
    <meta property="og:title" content="{{ .Title }} | {{ site.Title }}"/>
    <meta property="og:site_name" content="{{ site.Title }}"/>
    <meta property="og:url" content="{{ .Permalink }}"/>
    <link rel="canonical" href="{{ .Permalink }}"/>
    {{ partial "wp-inline-styles.html" . }}
    <link rel='stylesheet' id='contact-form-7-css' href="/wp-content/plugins/contact-form-7/includes/css/styles.css" type='text/css' media='all' />
    <link rel='stylesheet' id='wpb_wmca_accordion_style-css' href="/wp-content/plugins/wpb-accordion-menu-or-category/assets/css/wpb_wmca_style.css" type='text/css' media='all' />
    <script type="text/javascript" src="/wp-includes/js/jquery/jquery.min.js" id="jquery-core-js"></script>
    <script type="text/javascript" src="/wp-includes/js/jquery/jquery-migrate.min.js" id="jquery-migrate-js"></script>
    {{ partial "wp-custom-css.html" . }}
</head>
<body>
{{ partial "header.html" . }}
{{ block "main" . }}{{ end }}
{{ partial "footer.html" . }}
</body>
</html>
