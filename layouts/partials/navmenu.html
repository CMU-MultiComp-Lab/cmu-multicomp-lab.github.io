{{- /* ctx: dict "page" . "menu" "left" "id" "menu-main-menu-left" */ -}}
<div class="menu-main-menu-{{ .menu }}-container"><ul id="{{ .id }}" class="menu">
{{- $page := .page }}
{{- range index site.Menus .menu }}
<li class="menu-item{{ if or ($page.IsMenuCurrent "x" .) (hasPrefix $page.RelPermalink .URL) }} current-menu-item{{ end }}"><a href="{{ .URL }}">{{ .Name }}</a></li>
{{- end }}
</ul></div>
