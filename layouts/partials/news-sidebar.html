<div id="left_col" class="publication">
    <h3>Archives</h3>
    <ul>
    {{ range (where site.RegularPages "Section" "news").GroupByDate "2006-01" }}
        <li><a href="/news/#{{ .Key }}">{{ (time.AsTime (printf "%s-01" .Key)).Format "January 2006" }}</a></li>
    {{ end }}
    </ul>
    <h3>Categories</h3>
    <ul>
    {{ range site.Taxonomies.news_categories }}
        <li class="cat-item"><a href="{{ .Page.RelPermalink }}">{{ .Page.Title }}</a></li>
    {{ end }}
    </ul>
</div>
